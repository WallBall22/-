# Single-server production stack: app + PostgreSQL + Caddy (automatic HTTPS via Let's Encrypt).
# Usage (on the server, from servia-agent/):
#   cp .env.example .env   # fill in production values, NODE_ENV=production, AI_PROVIDER=openai
#   DOMAIN=agent.example.com POSTGRES_PASSWORD=... docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: servia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: servia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servia -d servia"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://servia:${POSTGRES_PASSWORD}@db:5432/servia
    depends_on:
      db:
        condition: service_healthy
    # Not published: only Caddy talks to the app.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
